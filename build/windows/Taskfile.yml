version: '3'

tasks:
  build:
    summary: Builds the Windows application binary
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - task: generate:launcher-syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - go build {{.LAUNCHER_BUILD_FLAGS}} -o "{{.BIN_DIR}}/win-admin-open.exe" ./cmd/win-admin-open
      - pwsh -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue *.syso, cmd/win-admin-open/*.syso"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
      LAUNCHER_BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-H windowsgui"{{else}}-trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:syso:
    summary: Generates the Windows resource object
    internal: true
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  generate:launcher-syso:
    summary: Generates the non-elevated file-association launcher resource object
    internal: true
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/win-admin-open.exe.manifest -info windows/info.json -out ../cmd/win-admin-open/win_admin_open_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    summary: Runs the Windows application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

